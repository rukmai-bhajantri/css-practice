<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box1 {
        width: 200px;
        height: 150px;
        background-color: orange;
        z-index: 10;
        border-radius: 10px;
        border: 2px solid black;
        position: absolute;
        top: 100px;
        left: 100px;
    }

    .box2 {
        width: 200px;
        height: 150px;
        background-color: white;
        z-index: 2;
        border-radius: 10px;
        border: 2px solid black;
        position: absolute;
        top: 150px;
        left: 150px;
    }

    .box3 {
        width: 200px;
        height: 150px;
        background-color: green;
        z-index: 3;
        border-radius: 10px;
        border: 2px solid black;
        position: absolute;
        
    }
</style>

<body>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
</body>

</html>
