      .butn{
        position: relative;
        padding: 20px 30px;
        background-color: blueviolet;
        border-radius: 10px;
        border: none;
        overflow: hidden;
        cursor: pointer;
        border:2px solid black;
      }
      .butn::after{
        content: "";
        position: absolute;
        left: 0;
        width: 0;
        height:100%;
        top:0;
        background-color: white;
        transition: 0.4s;

      }
      .butn:hover::after{
        width: 100%;
      }
      .butn span{
        position: relative;
        z-index: 1;
      }
      .butn:hover span{
        color: red;
      }
</style>
<body>
    <button class="butn"><span>Food NGO</span></button>
    <!-- <button class="btn"><span>Food Donor</span></button> -->
