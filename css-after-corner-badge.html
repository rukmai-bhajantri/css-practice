    .card img {

        height: 100%;
        object-fit: cover;
    }

    } */

    .card:hover::after {
        right: 0;
        bottom: 0;
    }
    .card h2 {
    position: absolute;
    z-index: 2;
    color:black;
    left: 20px;

}
.card::after {
    content: "hiii";
    position: absolute;
    width: 0;
    height: 0;
    right: 0;
    bottom: 0;
    background: green;
    border-radius: 50%;
    transition: 0.5s;
     color: white;
    display: flex;
    align-items: center;
    justify-content: center;

}

    width: 120px;

}
