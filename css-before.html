<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .title{
        position: relative;
        display: inline-block;
    }

    .title::after{
        content: "";
        position: absolute;
        width: 0;
        left: 0;
        height: 4px;
        bottom: 0;
        transition: 0.4s;
        background: green;
        cursor: pointer;
    }
    .title:hover::after{
        width: 100%;
    }

    width: 80px;
} */
</style>
<body>

</body>
</html>
