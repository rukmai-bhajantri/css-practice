<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box {
        position: relative;
        width: 300px;
        height: 200px;
        overflow: hidden;
        border-radius: 15px;
    }

    .box img {
        width: 100%;
        height: 100vh;
        object-fit: cover;

    }

    .box::after {
        position: absolute;
        content: "";
        width: 100%;
        height: 100%;
        right: -100%;
        /* left: 100%; */
        /* left:-100%; */
        top:0;
        /* left: 0; */
        /* top: 100%; */
        /* top: -100%; */
        background: rgba(0, 0, 0, 0.6);
        transition: 0.4s;
    }

    .box:hover::after {
        right: 0;
        /* width: 100%;
        left:0; */
        /* top: 0; */
    }
    .box-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    opacity: 0;
    transition: 0.4s;
    z-index: 2;
}
    .box:hover .box-text {
    opacity: 1;
}
</style>

<body>
    <div class="box">
        <img src="assets/img/about1.jpeg">
        <h1 class="box-text">Hello jrere</h1>
    </div>
</body>
</html>
