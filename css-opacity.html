<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box1{
        width:200px;
        height: 150px;
        background-color: red;
        border: 2px solid black;
        border-radius: 10px;
        opacity: 1;
    }
     .box2{
        width:200px;
        height: 150px;
        background-color:blue;
        border: 2px solid black;
        border-radius: 10px;
        opacity: 0.5;
    }
     .box3{
        width:200px;
        height: 150px;
        background-color:green;
        border: 2px solid black;
        border-radius: 10px;
        opacity: 0.2;
    }
</style>
<body>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
</body>

</html>
