<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    html{
        scroll-behavior:smooth;
        scroll-snap-type: y mandatory;
    }
    body{
        margin:0;
    }
    section{
        height: 100vh;
        width: 50%;
        scroll-snap-align: start;
    }
    .Home{
        background-color: brown;
    }
    .About{
        background-color: blanchedalmond;
    }
    .Contact{
        background-color: chartreuse;
    }
    nav {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 10;
    
}
</style>
<body>
  <nav>
    <a href="#Home">Home</a>
    <a href="#About">About</a>
    <a href="#Contact">Contact</a>
</nav>
    <section id="Home">
        <h1>Home page</h1>
    </section>
    <section id="About">
        <h1>About page</h1>
    </section>
    <section id="Contact">
        <h1>Contact page</h1>
    </section>
</body>

</html>
