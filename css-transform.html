<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box1{
        width: 200px;
        height: 150px;
        border: 2px solid black;
        border-radius: 10px;
        background-color: chartreuse;
        transform: translate(50px,20px);
    }
        .box2{
        width: 200px;
        height: 150px;
        border: 2px solid black;
        border-radius: 50px;
        background-color:blueviolet;
        transform:rotate(20deg);
    }
        .box3{
        width: 200px;
        height: 150px;
        border: 2px solid black;
        border-radius: 10px;
        background-color:brown;
        transform:scale(1.2);
    }
    .row{
        display: flex;
        flex-wrap: wrap;
    }
</style>
<body>
    <div class="row">
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
    </div>
</body>
</html>
