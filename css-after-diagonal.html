<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box {
        position: relative;
        width: 250px;
        height: 200px;
        overflow: hidden;
        border-radius: 15px;
    }

    .box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .box::after {
        content: "";
        position: absolute;
        width: 150%;
        height: 150%;
        top: -100%;
        left: -100%;
        background-image: url("assets/img/card1.png");
        background-size: cover;
        background-position: center;
        /* background: rgba(0, 0, 0, 0.6); */
        transform: rotate(45deg);
        transition: 0.5s;
    }

    .box:hover::after {
        top: -25%;
        left: -25%;
    }
</style>

<body>
    <div class="box">
        <img src="assets/img/about1.jpeg">
        <h1 class="text">Hello</h1>
    </div>
</body>

</html>
