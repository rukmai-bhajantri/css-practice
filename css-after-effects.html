<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .btn {
        padding: 15px 50px;
        background-color: brown;
        border: none;
        border-radius: 10px;
        color: black;
        position: relative;
        overflow: hidden;
        cursor: pointer;
    }

    .btn::after {
        content: "";
        position: absolute;
        width: 30px;
        height: 100%;
        left: -50px;
        top: 0;
        background: rgba(255, 255, 255, 0.6);
        transform: skewX(-20deg);
        transition: 0.5s;
    }

    .btn:hover::after {
        left: 110%;
    }

    /* .btn::after{
content: "";
position: absolute;
width: 0;
height: 100%;
top:0;
left:0;
transition: 0.4s;
 } */
    /* .btn:hover::after {
        width: 100%;
        background-color: cadetblue;
    } */

    .btn span {
        position: relative;
        z-index: 2;
        color: white;
    }
</style>

<body>
    <button class="btn"><span>Click here</span></button>
</body>

</html>
