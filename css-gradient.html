<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box1{
        width: 200px;
        height: 150px;
        background-color: blue;
        border: 2px solid black;
        border-radius: 10px;
        background: linear-gradient(red, blue);
    }
      .box2{
        width: 200px;
        height: 150px;
        background-color:brown;
        border: 2px solid black;
        border-radius: 10px;
        background:radial-gradient(red,yellow,green)
    }
      .box3{
        width: 200px;
        height: 150px;
        background-color: blue;
        border: 2px solid black;
        border-radius: 10px;
        background: linear-gradient(to right, blue,purple);
    }
    .row{
        display: flex;
        flex-wrap: wrap;
    }
</style>
<body>
    <div class="row">
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
    </div>
</body>
</html>
